<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าจอติดตามกล้องผู้เล่น</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #111; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    h1 { color: #2ed573; margin-bottom: 10px; }
    .room-card { background: #222; padding: 15px 25px; border-radius: 12px; border: 2px solid #2ed573; margin-bottom: 15px; }
    .room-code { font-size: 32px; font-weight: bold; color: #ffa500; letter-spacing: 4px; margin-top: 5px; }
    #video-container { margin-top: 10px; display: flex; justify-content: center; }
    video { width: 640px; height: 480px; background: #000; border-radius: 12px; border: 2px solid #333; transform: scaleX(-1); }
    #status { margin-top: 10px; font-size: 15px; color: #aaa; }
  </style>
</head>
<body>

  <h1>📺 หน้าจอติดตามกล้องผู้เล่น</h1>
  
  <div class="room-card">
    <div>นำรหัสนี้ไปให้ผู้เล่นกรอกเพื่อเปิดเกม:</div>
    <div class="room-code" id="my-room-code">กำลังสร้างรหัส...</div>
  </div>

  <div id="status">สถานะ: กำลังรอผู้เล่นกรอกรหัสและสแกนกล้อง...</div>

  <div id="video-container">
    <video id="playerVideo" autoplay playsinline muted></video>
  </div>

  <script>
    // สุ่มรหัสห้อง 4 หลัก
    const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('my-room-code').innerText = randomCode;

    const MY_STREAM_ID = 'apple-game-host-' + randomCode;
    const peer = new Peer(MY_STREAM_ID, {
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
    });

    const playerVideo = document.getElementById('playerVideo');
    const statusText = document.getElementById('status');

    // ตอบรับการทักทายตรวจสอบสถานะ
    peer.on('connection', (conn) => {
      statusText.innerText = '🟡 ผู้เล่นกำลังตรวจสอบรหัสห้องและสแกนกล้อง...';
    });

    // รับสายวิดีโอจากผู้เล่น
    peer.on('call', (call) => {
      statusText.innerText = '🟢 ตรวจสอบสำเร็จ! กำลังรับชมภาพสดจากผู้เล่น...';
      call.answer();
      call.on('stream', (remoteStream) => {
        playerVideo.srcObject = remoteStream;
        playerVideo.play();
      });
    });

    peer.on('error', (err) => {
      console.error(err);
      statusText.innerText = '🔴 เกิดข้อผิดพลาดในระบบส่งสัญญาณ';
    });
  </script>
</body>
</html>
