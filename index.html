<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมจับแอปเปิ้ลด้วยศีรษะ</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    h1 { margin-bottom: 12px; font-size: 22px; color: #ff4757; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    
    /* หน้าจอล็อก */
    #lock-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #111; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .lock-box { background: #222; padding: 30px; border-radius: 16px; border: 2px solid #ff4757; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 90%; width: 360px; }
    .lock-box h2 { color: #ff4757; margin-bottom: 15px; font-size: 20px; }
    .lock-box input { padding: 12px; font-size: 20px; width: 100%; text-align: center; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; letter-spacing: 3px; margin-bottom: 15px; display: block; }
    .lock-box button { padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; background: #2ed573; color: #000; cursor: pointer; transition: 0.2s; width: 100%; }
    .lock-box button:hover { background: #26af5f; }
    .lock-box button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    #error-msg { color: #ff4757; margin-top: 12px; font-size: 14px; display: none; font-weight: bold; }

    #game-container { position: relative; width: 640px; height: 480px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); background: #000; display: none; }
    video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; transform: scaleX(-1); }
    #ui-overlay { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
    .score-board { background: rgba(0, 0, 0, 0.6); padding: 8px 16px; border-radius: 20px; font-size: 20px; font-weight: bold; border: 2px solid #2ed573; color: #2ed573; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px 30px; border-radius: 10px; font-size: 18px; color: #ffa500; z-index: 20; }
  </style>
</head>
<body>

  <!-- หน้าจอล็อก -->
  <div id="lock-screen">
    <div class="lock-box">
      <h2>🔒 ตรวจสอบการเชื่อมต่อ</h2>
      <p style="margin-bottom: 12px; color: #ccc; font-size: 14px;">กรุณากรอกรหัส 4 หลักจากหน้าดูภาพ</p>
      <input type="number" id="code-input" placeholder="ใส่รหัส 4 หลัก" maxlength="4">
      <button id="start-btn" onclick="validateAndStart()">ตรวจสอบและเริ่มเล่นเกม</button>
      <div id="error-msg"></div>
    </div>
  </div>

  <h1>🍎 เกมเก็บแอปเปิ้ลด้วยศีรษะ 🍎</h1>

  <div id="game-container">
    <div id="loading">กำลังเปิดกล้องและระบบจับใบหน้า...</div>
    <div id="ui-overlay"><div class="score-board">คะแนน: <span id="score">0</span></div></div>
    <video id="webcam" playsinline style="display:none;"></video>
    <canvas id="gameCanvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('gameCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreElement = document.getElementById('score');
    const loadingElement = document.getElementById('loading');
    const lockScreen = document.getElementById('lock-screen');
    const gameContainer = document.getElementById('game-container');
    const startBtn = document.getElementById('start-btn');
    const errorMsg = document.getElementById('error-msg');

    let score = 0;
    let peer = null;

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.style.display = 'block';
      startBtn.innerText = 'ตรวจสอบและเริ่มเล่นเกม';
      startBtn.disabled = false;
    }

    async function validateAndStart() {
      const inputCode = document.getElementById('code-input').value.trim();
      errorMsg.style.display = 'none';

      if (!inputCode || inputCode.length !== 4) {
        showError('❌ กรุณากรอกรหัสห้องให้ถูกต้อง (ตัวเลข 4 หลัก)');
        return;
      }

      startBtn.innerText = '1/2 กำลังตรวจสอบกล้อง...';
      startBtn.disabled = true;

      // 1. ตรวจสอบการเข้าถึงกล้องก่อน
      let localStream = null;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      } catch (err) {
        showError('❌ ไม่พบกล้อง หรือคุณไม่ได้อนุญาตให้ใช้งานกล้อง!');
        return;
      }

      startBtn.innerText = '2/2 กำลังค้นหารหัสห้องคนดู...';

      // 2. ตรวจสอบรหัสห้องกับ PeerJS ฝั่งคนดู
      peer = new Peer({
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
      });

      peer.on('open', () => {
        const targetHostId = 'apple-game-host-' + inputCode;
        const canvasStream = canvasElement.captureStream(30);
        
        const conn = peer.connect(targetHostId);
        let isConnected = false;

        conn.on('open', () => {
          isConnected = true;
          // ส่งสายวิดีโอไปหาคนดู
          peer.call(targetHostId, canvasStream);

          // ผ่านการตรวจสอบทั้งสองขั้นตอน -> ปลดล็อกเข้าสู่เกม
          lockScreen.style.display = 'none';
          gameContainer.style.display = 'block';
          initGame(localStream);
        });

        // หากเชื่อมต่อคนดูไม่สำเร็จภายใน 4 วินาที
        setTimeout(() => {
          if (!isConnected) {
            peer.destroy();
            // ปิดกล้องทดสอบ
            localStream.getTracks().forEach(track => track.stop());
            showError('❌ ไม่พบรหัสห้องนี้! กรุณากรอกรหัสให้ถูก');
          }
        }, 4000);
      });

      peer.on('error', (err) => {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        showError('❌ ไม่สามารถเชื่อมต่อระบบส่งสัญญาณได้');
      });
    }

    let basket = { x: 320, y: 100, width: 100, height: 60 };
    let apples = [];
    const maxApples = 3;
    const appleRadius = 20;

    function createApple() {
      return { x: Math.random() * (canvasElement.width - 60) + 30, y: -30, speed: 3 + Math.random() * 4 };
    }

    function drawBasket(x, y) {
      canvasCtx.save();
      canvasCtx.fillStyle = '#8B4513';
      canvasCtx.beginPath();
      canvasCtx.roundRect(x - basket.width / 2, y, basket.width, basket.height, [0, 0, 15, 15]);
      canvasCtx.fill();
      canvasCtx.lineWidth = 3;
      canvasCtx.strokeStyle = '#5c2c06';
      canvasCtx.stroke();
      canvasCtx.strokeStyle = '#a65216';
      canvasCtx.beginPath();
      canvasCtx.moveTo(x - basket.width / 2 + 10, y + 20);
      canvasCtx.lineTo(x + basket.width / 2 - 10, y + 20);
      canvasCtx.moveTo(x - basket.width / 2 + 10, y + 40);
      canvasCtx.lineTo(x + basket.width / 2 - 10, y + 40);
      canvasCtx.stroke();
      canvasCtx.restore();
    }

    function drawApple(apple) {
      canvasCtx.save();
      canvasCtx.fillStyle = '#ff4757';
      canvasCtx.beginPath();
      canvasCtx.arc(apple.x, apple.y, appleRadius, 0, Math.PI * 2);
      canvasCtx.fill();
      canvasCtx.strokeStyle = '#2ed573';
      canvasCtx.lineWidth = 4;
      canvasCtx.beginPath();
      canvasCtx.moveTo(apple.x, apple.y - appleRadius);
      canvasCtx.quadraticCurveTo(apple.x + 5, apple.y - appleRadius - 10, apple.x + 10, apple.y - appleRadius - 8);
      canvasCtx.stroke();
      canvasCtx.restore();
    }

    function onResults(results) {
      loadingElement.style.display = 'none';
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const topHead = landmarks[10];
        basket.x = topHead.x * canvasElement.width;
        basket.y = (topHead.y * canvasElement.height) - basket.height - 10;
      }

      drawBasket(basket.x, basket.y);

      if (apples.length < maxApples && Math.random() < 0.03) {
        apples.push(createApple());
      }

      for (let i = apples.length - 1; i >= 0; i--) {
        let apple = apples[i];
        apple.y += apple.speed;
        drawApple(apple);

        const basketLeft = basket.x - basket.width / 2;
        const basketRight = basket.x + basket.width / 2;
        const basketTop = basket.y;
        const basketBottom = basket.y + basket.height;

        if (apple.x >= basketLeft && apple.x <= basketRight && apple.y + appleRadius >= basketTop && apple.y - appleRadius <= basketBottom) {
          score += 10;
          scoreElement.innerText = score;
          apples.splice(i, 1);
          continue;
        }

        if (apple.y - appleRadius > canvasElement.height) {
          apples.splice(i, 1);
        }
      }
      canvasCtx.restore();
    }

    function initGame(stream) {
      videoElement.srcObject = stream;
      videoElement.play();

      const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      faceMesh.onResults(onResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => { await faceMesh.send({ image: videoElement }); },
        width: 640, height: 480
      });
      camera.start();
    กรุณาเปิดหน้าคนดูรอไว้ล่วงหน้า'
