<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าจอติดตามกล้องผู้เล่น</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #fff; padding: 20px; }
    h1 { margin-bottom: 15px; color: #2ed573; }
    button { padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; border: none; background: #ff4757; color: white; cursor: pointer; }
    button:hover { background: #ff6b81; }
    #video-container { margin-top: 20px; display: flex; justify-content: center; }
    video { width: 640px; height: 480px; background: #000; border-radius: 12px; border: 2px solid #333; transform: scaleX(-1); }
    #status { margin-top: 10px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>
  <h1>📺 หน้าจอติดตามกล้องผู้เล่น</h1>
  <button onclick="watchCamera()">เปิดดูกล้องสด</button>
  <div id="status">สถานะ: ยังไม่ได้เชื่อมต่อ</div>
  <div id="video-container">
    <video id="playerVideo" autoplay playsinline muted></video>
  </div>
  <script>
    const TARGET_STREAM_ID = 'natthakit-apple-game-stream-2026';
    const peer = new Peer({
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
    });
    const playerVideo = document.getElementById('playerVideo');
    const statusText = document.getElementById('status');

    function watchCamera() {
      statusText.innerText = 'กำลังเชื่อมต่อ...';
      const call = peer.call(TARGET_STREAM_ID, new MediaStream());

      call.on('stream', (remoteStream) => {
        statusText.innerText = '🟢 เชื่อมต่อสำเร็จ! กำลังแสดงภาพหน้าจอเกมสด';
        playerVideo.srcObject = remoteStream;
        playerVideo.play();
      });

      call.on('error', (err) => {
        statusText.innerText = '🔴 เชื่อมต่อไม่สำเร็จ (เปิดเครื่องผู้เล่นค้างไว้ก่อนนะ)';
        console.error(err);
      });
    }
  </script>
</body>
</html>
